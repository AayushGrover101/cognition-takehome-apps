title: KYC review
description: Review identity-verification cases; escalate, approve or reject.
owner: compliance
access: [kyc_analyst, compliance_officer]
connectors: [kyc]
roles:
  kyc_analyst:
    tools: [kyc.list_cases, kyc.get_case, kyc.escalate_case]
  compliance_officer:
    tools: [kyc.list_cases, kyc.get_case, kyc.get_case_full, kyc.escalate_case, kyc.decide_case]
audit_reads: [kyc.get_case_full]     # every full tax ID view is recorded
audit_viewers: [compliance_officer]
