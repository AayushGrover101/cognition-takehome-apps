title: KYC review
description: Work the identity-verification queue, escalate hard cases and decide them.
owner: compliance
access: [kyc_analyst, compliance_officer]
connectors: [kyc]
roles:
  kyc_analyst:
    tools: [kyc.list_cases, kyc.get_case, kyc.escalate_case]
  compliance_officer:
    tools: [kyc.list_cases, kyc.get_case, kyc.escalate_case, kyc.decide_case, kyc.get_case_full]
audit: [kyc.decide_case, kyc.escalate_case, kyc.get_case_full]
audit_viewers: [compliance_officer]
audit_retention_days: 2555   # 7 years
