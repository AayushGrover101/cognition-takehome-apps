<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refunds</title>
<link rel="stylesheet" href="/web/base.css"><link rel="stylesheet" href="/shared/ui.css">
<script src="/web/gateway.js" defer></script><script src="/web/topbar.js" defer></script>
<script src="/shared/ui.js" defer></script><script src="app.js" defer></script></head>
<body>
<main class="page">
<header class="page-head"><h1>Refunds</h1><p class="sub">Customer refund requests. Agents issue refunds; leads can also decline them.</p></header>
<div class="split">
<section>
<div class="toolbar"><select id="status" aria-label="Status">
<option value="pending">Pending</option><option value="issued">Issued</option><option value="declined">Declined</option>
<option value="any">All refunds</option></select></div>
<table class="data"><thead><tr><th>Refund</th><th>Customer</th><th>Reason</th><th class="num">Amount</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
</section>
<aside class="drawer" id="detail"><p class="empty">Select a refund to handle it.</p></aside>
</div>
</main>
</body></html>
