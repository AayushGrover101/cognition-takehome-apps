<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feature flags</title>
<link rel="stylesheet" href="/web/base.css"><link rel="stylesheet" href="/shared/ui.css">
<script src="/web/gateway.js" defer></script><script src="/web/topbar.js" defer></script>
<script src="/shared/ui.js" defer></script><script src="app.js" defer></script></head>
<body>
<main class="page">
<header class="page-head"><h1>Feature flags</h1><p class="sub">What's on, where, and for how many customers. Engineers change flags; everyone else can see them.</p></header>
<div class="split">
<section>
<div class="toolbar"><select id="env" aria-label="Environment">
<option value="any">All environments</option><option value="prod">Production</option><option value="staging">Staging</option></select></div>
<table class="data"><thead><tr><th>Flag</th><th>Environment</th><th>State</th><th class="num">Rollout</th><th>Last changed by</th></tr></thead><tbody id="rows"></tbody></table>
</section>
<aside class="drawer" id="detail"><p class="empty">Select a flag to see it.</p></aside>
</div>
</main>
</body></html>
