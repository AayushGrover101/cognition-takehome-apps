name: Publish checks

# Runs on every pull request. pull_request_target means this file and the checks come from the main
# branch, so a pull request cannot edit or switch off its own checks. The pull request's files are
# only read as text. Nothing from the pull request is executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Publish checks
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the main branch (trusted checks and connector catalogue)
        uses: actions/checkout@v4
        with:
          path: trusted

      - name: Check out the pull request (read only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: List what the pull request changed
        run: git -C candidate diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > changed.txt

      - name: Run publish checks
        id: checks
        run: |
          pip install --quiet pyyaml
          status=0
          python3 trusted/checks/check_app.py --trusted trusted --candidate candidate --changed changed.txt --summary report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Post the result on the pull request
        if: always()
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md

      - name: Publish (merge) when every check passed
        if: steps.checks.outputs.result == 'pass'
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "${{ github.event.pull_request.head.sha }}"
